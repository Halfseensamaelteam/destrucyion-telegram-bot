# alembic.ini — destrucyion-telegram-bot
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Script location — where env.py and versions/ live
script_location = app/db/migrations

# Prepend sys.path with this location for env.py imports
prepend_sys_path = .

# Database URL — overridden by env.py from DATABASE_URL environment variable
# Do NOT hard-code credentials here.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/destrucyion

# Timezone for generated migration timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
